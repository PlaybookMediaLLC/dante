name: Branch policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  # A required check must also report on the merge queue's commit.
  merge_group:

permissions:
  contents: read

# This is a required check, so overlapping runs would make the context flap.
# `edited` fires on every pull request description change.
concurrency:
  group: branch-policy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Inspect metadata only. Never check out or execute code from the PR.
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'merge_group') {
              // Only develop has a merge queue, and a pull request enters it
              // only after this check passed on the pull request itself.
              if (context.payload.merge_group.base_ref === 'refs/heads/develop') {
                core.info('Merge queue entry for develop.');
              } else {
                core.setFailed('Only develop merges through a merge queue.');
              }
              return;
            }
            const pr = context.payload.pull_request;
            if (pr.base.ref === 'develop') {
              core.info('Work PR targets develop.');
            } else if (
              pr.base.ref === 'main' &&
              pr.head.ref === 'develop' &&
              pr.head.repo?.full_name === pr.base.repo.full_name
            ) {
              core.info('Release promotion from this repository’s develop to main.');
            } else {
              core.setFailed('Work PRs must target develop. Only this repository’s develop branch may target main for a release.');
            }
